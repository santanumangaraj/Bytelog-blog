# Production compose file for the "EC2 + Docker Compose, keep Aiven/Upstash"
# path documented in DEPLOYMENT.md's AWS appendix.
#
# Deliberately does NOT include the `mysql`/`redis` services from
# docker-compose.yml — this path uses the existing Aiven MySQL and Upstash
# Redis (same as backend/.env already points at), so running local
# mysql/redis containers here would be dead weight. Just as importantly: the
# dev compose file's backend/blog-worker/like-worker all have
# `depends_on: mysql: condition: service_healthy` — without a real local
# mysql actually running, those services would simply never start. Dropping
# the dependency here avoids that trap entirely.
#
# Run with:
#   docker compose -f docker-compose.prod.yml up -d --build

services:

  backend:
    build:
      context: ./backend

    container_name: bytelog-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    # IS_DOCKER is NOT set to true here, unlike docker-compose.yml — that
    # flag makes backend/config/redis.js use REDIS_URL_DOCKER, which is
    # meant to point at a *local* `redis` compose service (redis://redis:6379).
    # This file has no local redis service — it uses Upstash — so leaving
    # IS_DOCKER unset (or explicitly "false") makes it use the real
    # REDIS_URL from backend/.env instead.
    environment:
      IS_DOCKER: "false"

    # No host port published — Caddy reaches this over the internal compose
    # network at backend:8002, so the backend is never directly reachable
    # from outside the instance. Only Caddy's 80/443 need to be public.
    expose:
      - "8002"

    volumes:
      - ./backend/public/temp:/app/public/temp


  blog-worker:
    build:
      context: ./backend

    container_name: bytelog-blog-worker
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      IS_DOCKER: "false"

    volumes:
      - ./backend/public/temp:/app/public/temp

    command: npm run worker:blog


  like-worker:
    build:
      context: ./backend

    container_name: bytelog-like-worker
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      IS_DOCKER: "false"

    command: npm run worker:like


  caddy:
    image: caddy:2-alpine
    container_name: bytelog-caddy
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - backend


volumes:
  caddy_data:
  caddy_config:
